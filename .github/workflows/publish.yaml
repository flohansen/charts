name: Publish charts

on:
  push:
    branches:
      - main
    paths:
      - "*/Chart.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-charts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish charts
        run: |
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          for chart_file in */Chart.yaml; do
            chart="$(dirname "$chart_file")"
            version="$(helm show chart "$chart" | awk '/^version:/ {print $2}')"

            # Published versions are immutable, so only push new ones.
            if helm show chart "$registry/$chart" --version "$version" > /dev/null 2>&1; then
              echo "$chart $version is already published, skipping"
              continue
            fi

            helm lint "$chart" --strict
            helm package "$chart" --destination dist
            helm push "dist/$chart-$version.tgz" "$registry"
          done
